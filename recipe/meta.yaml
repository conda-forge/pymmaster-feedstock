{% set name = "pymmaster" %}
{% set version = "0.1.2" %}

package:
  name: "{{ name|lower }}"
  version: "{{ version }}"

source:
  url: "https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz"
  sha256: 763ec6177c2c32026145e8d143bf73ce9ce4ffda6c5db3bb78f0ac72895fa850

build:
  noarch: python
  number: 1
  script: "{{ PYTHON }} -m pip install . -vv"

requirements:
  host:
    - pip
    - python {{ python_min }}
  run:
    - fiona
    - gdal
    - geopandas
    - h5py
    - matplotlib-base
    - numpy
    - pandas
    - pybob >=0.26.2
    - pyproj
    - python >={{ python_min }}
    - scikit-image
    - scipy
    - shapely

test:
  imports:
    - pymmaster
  requires:
    - pip
    - python {{ python_min }}

about:
  home: "https://github.com/luc-girod/MMASTER-workflows"
  license: GPL-3.0-only
  license_family: GPL3
  license_file: LICENSE
  summary: "pymmaster is a python package for processing of ASTER DEMs using MMASTER."
  doc_url: "https://mmaster-workflows.readthedocs.io/"

extra:
  recipe-maintainers:
    - iamdonovan
